services:
  db:
    image: postgres:16-alpine
    container_name: validador-loterias-db
    environment:
      POSTGRES_USER: loterias
      POSTGRES_PASSWORD: loterias
      POSTGRES_DB: loterias
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loterias -d loterias"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
